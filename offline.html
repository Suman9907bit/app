<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#075985">

  <title>Jana Online Service - Offline</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;
      background:#f0f9ff;
      color:#082f49;
    }

    .offline-box{
      width:100%;
      max-width:430px;
      background:#ffffff;
      border-radius:22px;
      padding:35px 25px;
      text-align:center;
      box-shadow:
        0 10px 35px rgba(0,0,0,0.10);
      border:1px solid #e0f2fe;
    }

    .icon{
      width:90px;
      height:90px;
      margin:0 auto 20px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#e0f2fe;
      font-size:42px;
    }

    h1{
      font-size:25px;
      margin-bottom:10px;
      color:#075985;
    }

    h2{
      font-size:18px;
      margin-bottom:15px;
      color:#0c4a6e;
      font-weight:600;
    }

    p{
      font-size:15px;
      line-height:1.7;
      color:#475569;
      margin-bottom:22px;
    }

    .status{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 15px;
      border-radius:30px;
      background:#fef3c7;
      color:#92400e;
      font-size:14px;
      margin-bottom:22px;
    }

    .dot{
      width:9px;
      height:9px;
      border-radius:50%;
      background:#f59e0b;
    }

    button{
      border:none;
      outline:none;
      cursor:pointer;
      width:100%;
      padding:13px 20px;
      border-radius:10px;
      background:#075985;
      color:white;
      font-size:16px;
      font-weight:600;
      transition:0.2s;
    }

    button:hover{
      background:#0369a1;
    }

    .brand{
      margin-top:22px;
      font-size:13px;
      color:#64748b;
    }

    .brand strong{
      color:#075985;
    }
  </style>
</head>

<body>

  <div class="offline-box">

    <div class="icon">
      📡
    </div>

    <h1>Jana Online Service</h1>

    <h2>আপনি বর্তমানে Offline</h2>

    <div class="status">
      <span class="dot"></span>
      Internet Connection নেই
    </div>

    <p>
      এই মুহূর্তে আপনার Internet Connection নেই।
      Internet চালু হলে আবার চেষ্টা করুন।
    </p>

    <button onclick="location.reload()">
      🔄 আবার চেষ্টা করুন
    </button>

    <div class="brand">
      Digital Services & Online Support<br>
      <strong>Jana Online Service (JOS)</strong>
    </div>

  </div>

</body>
</html>
